services:
  mysql:
    image: mysql:8.0
    container_name: carrental_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-car_company}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carrental_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-car_company}
    depends_on:
      mysql:
        condition: service_healthy
    # ไม่ publish พอร์ตออก host — ให้ frontend (nginx) เป็นตัวเดียวที่คุยกับ backend ผ่าน internal docker network เท่านั้น

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_HOST: ${VITE_API_HOST}
        VITE_API_PORT: ${VITE_API_PORT}
        VITE_API_PROTOCOL: ${VITE_API_PROTOCOL}
    container_name: carrental_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
