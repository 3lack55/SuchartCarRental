services:
  mysql:
    image: mysql:8.0
    container_name: carrental_mysql
    restart: unless-stopped
    command: --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-car_company}
    ports:
      - "${TAILSCALE_IP}:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carrental_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-car_company}
    depends_on:
      mysql:
        condition: service_healthy
    # ไม่ publish พอร์ตออก host — ให้ frontend (nginx) เป็นตัวเดียวที่คุยกับ backend ผ่าน internal docker network เท่านั้น

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_HOST: ${VITE_API_HOST}
        VITE_API_PORT: ${VITE_API_PORT}
        VITE_API_PROTOCOL: ${VITE_API_PROTOCOL}
    container_name: carrental_frontend
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:8080:80"
    depends_on:
      - backend

  # Cloudflare Quick Tunnel — เปิดช่องทางเข้าเว็บจากอินเทอร์เน็ตโดยไม่ต้องอยู่ใน tailnet
  # ไม่ต้อง publish port ใดๆ เพราะต่อออกไปหา Cloudflare edge เอง (outbound only)
  # URL จะสุ่มใหม่ทุกครั้งที่ container restart — เช็คได้จาก `docker logs carrental_cloudflared`
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: carrental_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  mysql_data:
